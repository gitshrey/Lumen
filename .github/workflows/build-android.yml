name: Build & Release Lumen Android APK

# ALL-IN-ONE SINGLE-FILE ANDROID WORKFLOW (Phones & Tablets of All Sizes)
# Place ONLY this file at .github/workflows/build-android.yml in your GitHub repository.
# Builds a signed Release-only APK with hardware-accelerated playback, native Android PiP,
# "Open With -> Lumen" support, auto-incrementing versionCode, and publishes to GitHub Releases.

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack complete Lumen Android project (Phones & Tablets)
