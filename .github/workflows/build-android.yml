          node - << 'NODE_EOF'
          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');

          const workDir = path.join(process.cwd(), 'lumen-android-build');
          fs.mkdirSync(path.join(workDir, 'www'), { recursive: true });
          fs.mkdirSync(path.join(workDir, 'adaptive_icons'), { recursive: true });

          const b64 = fs.readFileSync(path.join(workDir, 'bundle.b64'), 'utf8').replace(/\s+/g, '');
          fs.unlinkSync(path.join(workDir, 'bundle.b64'));
          const bundle = JSON.parse(zlib.gunzipSync(Buffer.from(b64, 'base64')).toString('utf8'));

          // Inject live build version into HTML for Android in-app GitHub Update Checker
          const ver = process.env.VER || '3.0.1';
          const htmlOut = bundle['www/index.html'].replace(/__LUMEN_BUILD_VER__/g, ver);
          fs.writeFileSync(path.join(workDir, 'www', 'index.html'), htmlOut, 'utf8');

          // Unpack persistent signing keystore so every APK update shares the exact same signature
          fs.writeFileSync(path.join(workDir, 'lumen-release.jks'), Buffer.from(bundle.keystore_b64, 'base64'));

          // Unpack full-bleed adaptive icon layers (bg, fg, legacy) across all densities
          for (const [density, layers] of Object.entries(bundle.adaptive_icons || {})) {
            const ddir = path.join(workDir, 'adaptive_icons', density);
            fs.mkdirSync(ddir, { recursive: true });
            fs.writeFileSync(path.join(ddir, 'bg.png'), Buffer.from(layers.bg, 'base64'));
            fs.writeFileSync(path.join(ddir, 'fg.png'), Buffer.from(layers.fg, 'base64'));
            fs.writeFileSync(path.join(ddir, 'leg.png'), Buffer.from(layers.leg, 'base64'));
          }

          const pkg = {
            name: 'lumen-video-player-android',
            version: ver,
            private: true,
            dependencies: {
              '@capacitor/core': '6.2.0',
              '@capacitor/android': '6.2.0'
            },
            devDependencies: {
              '@capacitor/cli': '6.2.0'
            }
          };
          fs.writeFileSync(path.join(workDir, 'package.json'), JSON.stringify(pkg, null, 2));

          const capConfig = {
            appId: 'com.gitshrey.lumenplayer',
            appName: 'Lumen Video Player',
            webDir: 'www',
            android: {
              backgroundColor: '#080A11',
              allowMixedContent: true,
              captureInput: true,
              webContentsDebuggingEnabled: false
            },
            server: {
              androidScheme: 'https'
            }
          };
          fs.writeFileSync(path.join(workDir, 'capacitor.config.json'), JSON.stringify(capConfig, null, 2));
          console.log('Unpacked Lumen Android v' + ver + ' cleanly.');
          NODE_EOF

      - name: Install Capacitor 6, Adaptive Icons, Edge-to-Edge Status Bar & Manifest
        working-directory: lumen-android-build
        env:
          VER: 3.0.${{ github.run_number }}
          VER_CODE: ${{ github.run_number }}
        run: |
          npm install --no-audit --no-fund
          npx cap add android

          node - << 'NODE_EOF'
          const fs = require('fs');
          const path = require('path');

          const resRoot = path.join('android', 'app', 'src', 'main', 'res');

          // 1. Install Native Full-Bleed Adaptive Icons (ZERO white border on any launcher shape!)
          for (const density of ['mipmap-mdpi', 'mipmap-hdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi']) {
            const srcDir = path.join('adaptive_icons', density);
            if (!fs.existsSync(srcDir)) continue;
            const dpath = path.join(resRoot, density);
            fs.mkdirSync(dpath, { recursive: true });
            fs.copyFileSync(path.join(srcDir, 'bg.png'), path.join(dpath, 'ic_launcher_background.png'));
            fs.copyFileSync(path.join(srcDir, 'fg.png'), path.join(dpath, 'ic_launcher_foreground.png'));
            fs.copyFileSync(path.join(srcDir, 'leg.png'), path.join(dpath, 'ic_launcher.png'));
            fs.copyFileSync(path.join(srcDir, 'leg.png'), path.join(dpath, 'ic_launcher_round.png'));
          }

          const anydpi = path.join(resRoot, 'mipmap-anydpi-v26');
          fs.mkdirSync(anydpi, { recursive: true });
          const adaptiveXml = [
            '<?xml version="1.0" encoding="utf-8"?>',
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">',
            '    <background android:drawable="@mipmap/ic_launcher_background"/>',
            '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>',
            '</adaptive-icon>'
          ].join('\n');
          fs.writeFileSync(path.join(anydpi, 'ic_launcher.xml'), adaptiveXml, 'utf8');
          fs.writeFileSync(path.join(anydpi, 'ic_launcher_round.xml'), adaptiveXml, 'utf8');

          // 2. Patch styles.xml for True Edge-to-Edge Transparent Phone Status Bar & Nav Bar
          const stylesPath = path.join(resRoot, 'values', 'styles.xml');
          if (fs.existsSync(stylesPath)) {
            let styles = fs.readFileSync(stylesPath, 'utf8');
            const edgeItems = [
              '        <item name="android:statusBarColor">@android:color/transparent</item>',
              '        <item name="android:navigationBarColor">@android:color/transparent</item>',
              '        <item name="android:windowDrawsSystemBarBackgrounds">true</item>',
              '        <item name="android:windowLightStatusBar">false</item>',
              '        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>',
              '    </style>'
            ].join('\n');
            styles = styles.replace('</style>', edgeItems);
            fs.writeFileSync(stylesPath, styles, 'utf8');
          }

          // 3. Patch MainActivity.java to enable WindowCompat Edge-to-Edge behind status bar
          const mainActPath = path.join('android', 'app', 'src', 'main', 'java', 'com', 'gitshrey', 'lumenplayer', 'MainActivity.java');
          if (fs.existsSync(mainActPath)) {
            const edgeActivity = [
              'package com.gitshrey.lumenplayer;',
              'import android.graphics.Color;',
              'import android.os.Bundle;',
              'import androidx.core.view.WindowCompat;',
              'import com.getcapacitor.BridgeActivity;',
              'public class MainActivity extends BridgeActivity {',
              '    @Override',
              '    public void onCreate(Bundle savedInstanceState) {',
              '        super.onCreate(savedInstanceState);',
              '        WindowCompat.setDecorFitsSystemWindows(getWindow(), false);',
              '        getWindow().setStatusBarColor(Color.TRANSPARENT);',
              '        getWindow().setNavigationBarColor(Color.TRANSPARENT);',
              '    }',
              '}'
            ].join('\n');
            fs.writeFileSync(mainActPath, edgeActivity, 'utf8');
          }

          // 4. Patch AndroidManifest.xml (Tablets, Foldables, PiP, Permissions, Open-With)
          const manifestPath = path.join('android', 'app', 'src', 'main', 'AndroidManifest.xml');
          let manifest = fs.readFileSync(manifestPath, 'utf8');
          const perms = [
            '    <uses-permission android:name="android.permission.INTERNET" />',
            '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
            '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />',
            '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
            '    <uses-permission android:name="android.permission.WAKE_LOCK" />'
          ].join('\n');
          if (!manifest.includes('READ_MEDIA_VIDEO')) {
            manifest = manifest.replace('<uses-permission android:name="android.permission.INTERNET" />', perms);
          }
          if (!manifest.includes('supportsPictureInPicture')) {
            manifest = manifest.replace(
              'android:launchMode="singleTask"',
              'android:launchMode="singleTask" android:supportsPictureInPicture="true" android:resizeableActivity="true" android:screenOrientation="unspecified"'
            );
          }
          const openWith = [
            '            <intent-filter>',
            '                <action android:name="android.intent.action.VIEW" />',
            '                <category android:name="android.intent.category.DEFAULT" />',
            '                <category android:name="android.intent.category.BROWSABLE" />',
            '                <data android:mimeType="video/*" />',
            '                <data android:mimeType="audio/*" />',
            '            </intent-filter>',
            '        </activity>'
          ].join('\n');
          if (!manifest.includes('video/*')) {
            manifest = manifest.replace('</activity>', openWith);
          }
          fs.writeFileSync(manifestPath, manifest, 'utf8');

          // 5. Patch versionCode & versionName in android/app/build.gradle
          const gradlePath = path.join('android', 'app', 'build.gradle');
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          const ver = process.env.VER || '3.0.1';
          const vcode = 100 + (parseInt(process.env.VER_CODE || '1', 10) || 1);
          gradle = gradle.replace(/versionCode\s+\d+/, 'versionCode ' + vcode);
          gradle = gradle.replace(/versionName\s+"[^"]+"/, 'versionName "' + ver + '"');
          fs.writeFileSync(gradlePath, gradle, 'utf8');
          console.log('Patched adaptive icons, edge-to-edge status bar, manifest & Gradle cleanly.');
          NODE_EOF

          npx cap sync android

      - name: Build & Sign Installable Android APK (Consistent Keystore)
        working-directory: lumen-android-build/android
        env:
          VER: 3.0.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

          KEYSTORE_PATH="../lumen-release.jks"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-aligned.apk"
          FINAL_APK="../../Lumen-Android-${VER}.apk"

          "$BUILD_TOOLS_DIR/zipalign" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign --ks "$KEYSTORE_PATH" --ks-key-alias lumen \
            --ks-pass pass:lumenrelease123 --key-pass pass:lumenrelease123 \
            --out "$FINAL_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify "$FINAL_APK"

          cd ../..
          sha256sum "Lumen-Android-${VER}.apk" > SHA256SUMS-android.txt
          ls -lh "Lumen-Android-${VER}.apk" SHA256SUMS-android.txt

      - name: Publish Android APK to Separate GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v3.0.${{ github.run_number }}
          name: Lumen Video Player Android v3.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Lumen Video Player 3.0 for Android (Phones & Tablets)
            - **Folder-Style Liquid Glass Settings**: Clean 2-column Bento folder cards instead of cramped scrolling tabs.
            - **VLC-Style Portrait & Landscape Player**: Centered play/±10s controls, screen lock, portrait/landscape rotate button, and aligned bottom tiles.
            - **Seamless In-Place Updates**: Signed with a permanent consistent release keystore + working in-app **Check for Updates** for GitHub Android APK releases.
            - **Edge-to-Edge Status Bar & Adaptive Icon**: Transparent status bar merged seamlessly with the twilight header, fluid app opening animation, and full-bleed Adaptive Icons with zero white border on all launcher shapes.
          files: |
            Lumen-Android-3.0.${{ github.run_number }}.apk
            SHA256SUMS-android.txt
