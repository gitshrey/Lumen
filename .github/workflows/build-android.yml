          const fs = require('fs');
          const path = require('path');
          const zlib = require('zlib');

          const workDir = path.join(process.cwd(), 'lumen-android-build');
          fs.mkdirSync(path.join(workDir, 'www'), { recursive: true });
          fs.mkdirSync(path.join(workDir, 'icons'), { recursive: true });

          const b64 = fs.readFileSync(path.join(workDir, 'bundle.b64'), 'utf8').replace(/\s+/g, '');
          fs.unlinkSync(path.join(workDir, 'bundle.b64'));
          const bundle = JSON.parse(zlib.gunzipSync(Buffer.from(b64, 'base64')).toString('utf8'));

          fs.writeFileSync(path.join(workDir, 'www', 'index.html'), bundle['www/index.html'], 'utf8');
          for (const [density, pngB64] of Object.entries(bundle.icons || {})) {
            fs.writeFileSync(path.join(workDir, 'icons', density + '.png'), Buffer.from(pngB64, 'base64'));
          }

          const pkg = {
            name: 'lumen-video-player-android',
            version: process.env.VER || '3.0.1',
            private: true,
            dependencies: {
              '@capacitor/core': '6.2.0',
              '@capacitor/android': '6.2.0'
            },
            devDependencies: {
              '@capacitor/cli': '6.2.0'
            }
          };
          fs.writeFileSync(path.join(workDir, 'package.json'), JSON.stringify(pkg, null, 2));

          const capConfig = {
            appId: 'com.gitshrey.lumenplayer',
            appName: 'Lumen Video Player',
            webDir: 'www',
            android: {
              backgroundColor: '#141722',
              allowMixedContent: true,
              captureInput: true,
              webContentsDebuggingEnabled: false
            },
            server: {
              androidScheme: 'https'
            }
          };
          fs.writeFileSync(path.join(workDir, 'capacitor.config.json'), JSON.stringify(capConfig, null, 2));
          console.log('Unpacked Lumen Android project cleanly.');
          NODE_EOF

      - name: Install Capacitor 6, Generate Android Project, Icons & Manifest
        working-directory: lumen-android-build
        env:
          VER: 3.0.${{ github.run_number }}
          VER_CODE: ${{ github.run_number }}
        run: |
          npm install --no-audit --no-fund
          npx cap add android

          node - << 'NODE_EOF'
          const fs = require('fs');
          const path = require('path');

          // 1. Install pre-rendered Liquid-Glass Play Prism launcher icons across all densities
          const resRoot = path.join('android', 'app', 'src', 'main', 'res');
          for (const density of ['mipmap-mdpi', 'mipmap-hdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi']) {
            const src = path.join('icons', density + '.png');
            if (!fs.existsSync(src)) continue;
            const dpath = path.join(resRoot, density);
            fs.mkdirSync(dpath, { recursive: true });
            const buf = fs.readFileSync(src);
            for (const fname of ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']) {
              fs.writeFileSync(path.join(dpath, fname), buf);
            }
          }
          const anydpi = path.join(resRoot, 'mipmap-anydpi-v26');
          if (fs.existsSync(anydpi)) {
            for (const fn of fs.readdirSync(anydpi)) {
              if (fn.endsWith('.xml')) fs.unlinkSync(path.join(anydpi, fn));
            }
          }

          // 2. Patch AndroidManifest.xml for tablets, foldables, PiP, media permissions & Open With video/audio
          const manifestPath = path.join('android', 'app', 'src', 'main', 'AndroidManifest.xml');
          let manifest = fs.readFileSync(manifestPath, 'utf8');

          const perms = [
            '    <uses-permission android:name="android.permission.INTERNET" />',
            '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
            '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />',
            '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
            '    <uses-permission android:name="android.permission.WAKE_LOCK" />'
          ].join('\n');

          if (!manifest.includes('READ_MEDIA_VIDEO')) {
            manifest = manifest.replace('<uses-permission android:name="android.permission.INTERNET" />', perms);
          }
          if (!manifest.includes('supportsPictureInPicture')) {
            manifest = manifest.replace(
              'android:launchMode="singleTask"',
              'android:launchMode="singleTask" android:supportsPictureInPicture="true" android:resizeableActivity="true" android:screenOrientation="unspecified"'
            );
          }
          const openWith = [
            '            <intent-filter>',
            '                <action android:name="android.intent.action.VIEW" />',
            '                <category android:name="android.intent.category.DEFAULT" />',
            '                <category android:name="android.intent.category.BROWSABLE" />',
            '                <data android:mimeType="video/*" />',
            '                <data android:mimeType="audio/*" />',
            '            </intent-filter>',
            '        </activity>'
          ].join('\n');
          if (!manifest.includes('video/*')) {
            manifest = manifest.replace('</activity>', openWith);
          }
          fs.writeFileSync(manifestPath, manifest, 'utf8');

          // 3. Patch versionCode & versionName in android/app/build.gradle
          const gradlePath = path.join('android', 'app', 'build.gradle');
          let gradle = fs.readFileSync(gradlePath, 'utf8');
          const ver = process.env.VER || '3.0.1';
          const vcode = parseInt(process.env.VER_CODE || '1', 10) || 1;
          gradle = gradle.replace(/versionCode\s+\d+/, 'versionCode ' + vcode);
          gradle = gradle.replace(/versionName\s+"[^"]+"/, 'versionName "' + ver + '"');
          fs.writeFileSync(gradlePath, gradle, 'utf8');
          console.log('Patched Android icons, manifest, and Gradle version cleanly.');
          NODE_EOF

          npx cap sync android

      - name: Build & Sign Installable Android APK
        working-directory: lumen-android-build/android
        env:
          VER: 3.0.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

          KEYSTORE_PATH="$PWD/lumen-release.jks"
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -keyalg RSA -keysize 2048 -validity 10000 \
            -alias lumen -storepass lumenrelease123 -keypass lumenrelease123 \
            -dname "CN=Lumen Video Player, OU=Mobile, O=gitshrey, L=India, C=IN"

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-aligned.apk"
          FINAL_APK="../../Lumen-Android-${VER}.apk"

          "$BUILD_TOOLS_DIR/zipalign" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign --ks "$KEYSTORE_PATH" --ks-key-alias lumen \
            --ks-pass pass:lumenrelease123 --key-pass pass:lumenrelease123 \
            --out "$FINAL_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify "$FINAL_APK"

          cd ../..
          sha256sum "Lumen-Android-${VER}.apk" > SHA256SUMS-android.txt
          ls -lh "Lumen-Android-${VER}.apk" SHA256SUMS-android.txt

      - name: Publish Android APK to Separate GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v3.0.${{ github.run_number }}
          name: Lumen Video Player Android v3.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Lumen Video Player 3.0 for Android (Phones & Tablets)
            - **Adaptive Liquid Glass UI**: Full sidebar on tablets, floating Liquid Glass bottom bar on smartphones, Warm Obsidian & Soft Periwinkle-Rose eye-comfort theme, and next-gen Play Prism icon.
            - **All Windows Features Included**: 12 customizable zero-jump subtitle animations (with live preview, size slider & custom colors in Settings), 5-band Equalizer + 200% Volume Boost, Dual Subtitles, Playlists, Favourites, Recently Played, Resume, and Low-End Mode.
            - **Mobile Touch Gestures**: Double-tap left/right to seek ±10s, hold to 2× speed, swipe left side for brightness, swipe right side for volume, Picture-in-Picture, and Android "Open with → Lumen Video Player".
          files: |
            Lumen-Android-3.0.${{ github.run_number }}.apk
            SHA256SUMS-android.txt
