name: Build & Release Lumen Android APK

# ALL-IN-ONE SINGLE-FILE ANDROID WORKFLOW (Lumen Video Player 3.0)
# Strictly isolated from Windows builds: ONLY runs when .github/workflows/build-android.yml changes or via manual dispatch.
# Uses a permanent consistent release keystore so future APK updates install cleanly in-place without "Invalid package" errors.
# Save this file as: .github/workflows/build-android.yml

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unpack Lumen Android App (Phones & Tablets)
        env:
          VER: 3.0.${{ github.run_number }}
          VER_CODE: ${{ github.run_number }}
        run: |
          mkdir -p lumen-android-build
