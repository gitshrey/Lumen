            +L9SXH3alN1+Jlurk4C/ZnDUS3/I00qwsry7L//Of//vv/L1harQr2AwA=
        run: |
          echo "APP_VERSION=$VER_NAME" >> "$GITHUB_ENV"
          python3 - << 'PY'
          import base64, gzip, json, os, re
          b64 = re.sub(r'\s+', '', os.environ['LUMEN_ANDROID_B64'])
          files = json.loads(gzip.decompress(base64.b64decode(b64)).decode('utf-8'))
          root = 'android-app'
          icon_b64 = files.pop('__icon_png_b64__')
          icon_path = os.path.join(root, 'app/src/main/res/mipmap-xxhdpi/ic_launcher.png')
          os.makedirs(os.path.dirname(icon_path), exist_ok=True)
          open(icon_path, 'wb').write(base64.b64decode(icon_b64))
          for rel, content in files.items():
              full = os.path.join(root, rel)
              os.makedirs(os.path.dirname(full), exist_ok=True)
              content = content.replace('__VER_CODE__', os.environ['VER_CODE']).replace('__VER_NAME__', os.environ['VER_NAME'])
              open(full, 'w', encoding='utf-8').write(content)
          print('Unpacked Lumen Android v' + os.environ['VER_NAME'])
          PY

      - name: Prepare Release Keystore (persistent secret or fallback)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android-app/app/release.keystore
          else
            keytool -genkeypair -v -keystore android-app/app/release.keystore \
              -alias "${KEY_ALIAS:-lumen}" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${KS_PASS:-lumenreleasekey}" -keypass "${KEY_PASS:-lumenreleasekey}" \
              -dname "CN=Lumen, OU=Mobile, O=Lumen, L=Jabalpur, ST=MP, C=IN"
          fi

      - name: Build Signed Release-Only APK
        working-directory: android-app
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          yes | ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "../Lumen-Android-v${APP_VERSION}.apk"

      - name: Publish Signed Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.APP_VERSION }}
          name: Lumen for Android v${{ env.APP_VERSION }} (Phones & Tablets)
          body: |
            ### Lumen Media Player for Android v${{ env.APP_VERSION }}
            - **Direct Signed Release APK**: Download and tap `Lumen-Android-v${{ env.APP_VERSION }}.apk` on any Android phone or tablet (Android 8.0+).
            - **Adaptive Phone & Tablet Layout**: Floating bottom Liquid Glass nav bar on phones, frosted Liquid Glass sidebar on tablets, double-tap left/right to seek 10s, and seamless portrait/landscape rotation.
            - **Native Android PiP & Open With**: Supports Android Picture-in-Picture, File Manager "Open With → Lumen", 6 animated subtitle styles, VLC-style resume, Playlists, A-B Loop, Color Adjustments, and Low-End Device Lite Mode.
          files: Lumen-Android-v*.apk
          generate_release_notes: true
          make_latest: true
