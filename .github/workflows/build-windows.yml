            rh97OLL36UcTUTpG09JIQciB9uWiqnspMnJkTgY7lxxGENWU1Zt0KzW3q/4tnWWKN+GpdxaKVALWR9ek1Zwn00XEl8+M0oAbrjZ10rXymLHEa5
            CMJlVPmzoJ+yZCtLLXLNOX3cAAPbYkPyX0zWbU2zLBb6xJfXV2LP5Y4gk/6aM0SG49MNOAHH4GKTCN4pOkZ69D7lD4Ai0D2nP+zTEXKEVJLHxE
            JlUwT97yflxH85NDROpTFrM+EmWVqVJ+szaTEQer0wjI3g7a2UpdXVfIcZnZz/I9cFCt7eqFpHv9/wCu7TVlBAsDAA==
        run: |
          $ver = "2.0.$env:GITHUB_RUN_NUMBER"
          echo "APP_VERSION=$ver" >> $env:GITHUB_ENV
          $repo = "$env:GITHUB_REPOSITORY"

          node -e "
            const fs = require('fs'), path = require('path'), zlib = require('zlib');
            const b64 = (process.env.VELA_BUNDLE_B64 || '').replace(/\s+/g, '');
            const files = JSON.parse(zlib.gunzipSync(Buffer.from(b64, 'base64')).toString('utf8'));
            for (const [rel, content] of Object.entries(files)) {
              fs.mkdirSync(path.dirname(rel), { recursive: true });
              fs.writeFileSync(rel, content, 'utf8');
            }
            fs.mkdirSync('resources/mpv', { recursive: true });
            const pkg = {
              name: 'vela-media-player',
              productName: 'Vela',
              version: process.env.VER,
              description: 'Apple Liquid Glass Windows 11 media player powered by libmpv, FFmpeg, libass, and libplacebo.',
              author: 'Vela',
              repository: process.env.REPO,
              main: 'electron/main.js',
              scripts: { start: 'electron .', 'build:win': 'electron-builder --win nsis --x64 --publish never' },
              devDependencies: { electron: '^34.0.0', 'electron-builder': '^25.1.8' },
              build: {
                appId: 'com.vela.mediaplayer',
                productName: 'Vela',
                directories: { output: 'dist' },
                files: ['electron/**/*', 'src/**/*'],
                extraResources: [{ from: 'resources/mpv', to: 'mpv', filter: ['**/*'] }],
                win: {
                  signAndEditExecutable: Boolean(process.env.WIN_CSC_LINK),
                  requestedExecutionLevel: 'asInvoker',
                  target: [{ target: 'nsis', arch: ['x64'] }],
                  artifactName: 'Vela-Setup-' + process.env.VER + '-x64.exe'
                },
                nsis: {
                  oneClick: false,
                  perMachine: false,
                  allowToChangeInstallationDirectory: true,
                  createDesktopShortcut: true,
                  createStartMenuShortcut: true,
                  shortcutName: 'Vela Media Player',
                  deleteAppDataOnUninstall: false
                }
              }
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('Generated Vela v' + pkg.version + ' for ' + pkg.repository);
          "

      - name: Download mpv & FFmpeg Windows x64 binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $headers = @{ "User-Agent" = "vela-ci"; "Authorization" = "Bearer $env:GH_TOKEN" }
          try {
            $mpvRel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
            $mpvAsset = $mpvRel.assets | Where-Object { $_.name -match '^mpv-x86_64-.*\.7z$' -and $_.name -notmatch 'v3' } | Select-Object -First 1
            if ($mpvAsset) {
              Invoke-WebRequest -Uri $mpvAsset.browser_download_url -OutFile "mpv.7z"
              7z x mpv.7z -o"mpv_tmp" -y | Out-Null
              $exe = Get-ChildItem -Path "mpv_tmp" -Filter "mpv.exe" -Recurse | Select-Object -First 1
              if ($exe) { Copy-Item $exe.FullName -Destination "resources/mpv/mpv.exe" -Force }
              Get-ChildItem -Path "mpv_tmp" -Filter "*.dll" -Recurse | ForEach-Object { Copy-Item $_.FullName -Destination (Join-Path "resources/mpv" $_.Name) -Force }
              Remove-Item -Recurse -Force "mpv.7z", "mpv_tmp" -ErrorAction SilentlyContinue
            }
          } catch { Write-Warning "mpv download warning: $_" }
          try {
            Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
            Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_tmp" -Force
            $ffp = Get-ChildItem -Path "ffmpeg_tmp" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
            if ($ffp) { Copy-Item $ffp.FullName -Destination "resources/mpv/ffprobe.exe" -Force }
            Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_tmp" -ErrorAction SilentlyContinue
          } catch { Write-Warning "ffprobe download warning: $_" }

      - name: Install dependencies & build Windows NSIS Installer (.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npm install
          npm run build:win

      - name: Publish direct Windows .exe Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Vela Media Player v${{ env.APP_VERSION }}
          body: |
            ### Vela Media Player v${{ env.APP_VERSION }} (Windows 11)
            - **Direct Windows Installer**: Download and double-click `Vela-Setup-${{ env.APP_VERSION }}-x64.exe` below (no zip extraction needed).
            - **Easy Over-the-Top Updates**: Run any new installer to upgrade cleanly while preserving your settings and VLC-style resume history (or use **Settings → About → Check for Updates** inside Vela).
            - **Highlights**: Apple Liquid Glass UI, minimalist header, compact single-line Quick Actions, Shorts-style big animated subtitles, persistent resume across restarts, and native `libmpv` + `FFmpeg` + `libass` + `libplacebo`.
          files: dist/Vela-Setup-*.exe
          generate_release_notes: true
          make_latest: true
