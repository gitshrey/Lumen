name: Build & Release Vela Windows Installer

# ALL-IN-ONE SINGLE-FILE WORKFLOW
# Replace ONLY .github/workflows/build-windows.yml in your GitHub repository.
# Every push to main automatically unpacks the full Vela app (UI + Electron + libmpv),
# builds a clean per-user Windows 11 NSIS installer (.exe), and publishes it to GitHub Releases.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unpack embedded Vela project & generate package.json
        shell: pwsh
        env:
          VER: 2.0.${{ github.run_number }}
          REPO: ${{ github.repository }}
