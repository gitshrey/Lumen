name: Build & Release Lumen Windows Installer

# ALL-IN-ONE SINGLE-FILE WORKFLOW (Lumen 3.0)
# Latest 2026 Stack: Node.js 24 LTS + Electron 45.4.1 (Chromium 156) + electron-builder 26.18.0
# Replace ONLY .github/workflows/build-windows.yml in your GitHub repository.

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Unpack Lumen 3.0 project, modern installer visuals & package.json
