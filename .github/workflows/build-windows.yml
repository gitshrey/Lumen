            fs.writeFileSync('build/icon.ico', Buffer.from(files.__ico_b64__, 'base64'));
            fs.writeFileSync('build/installerSidebar.bmp', Buffer.from(files.__sidebar_b64__, 'base64'));
            fs.writeFileSync('build/installerHeader.bmp', Buffer.from(files.__header_b64__, 'base64'));
            delete files.__ico_b64__; delete files.__sidebar_b64__; delete files.__header_b64__;
            for (const [rel, content] of Object.entries(files)) {
              fs.mkdirSync(path.dirname(rel), { recursive: true });
              fs.writeFileSync(rel, content, 'utf8');
            }
            fs.mkdirSync('resources/mpv', { recursive: true });
            const pkg = {
              name: 'lumen-media-player',
              productName: 'Lumen',
              version: process.env.VER,
              description: 'Liquid Glass Windows 11 media player with 6 subtitle animations, fast subtitle extraction, playlists, and Windows Open With support.',
              author: 'Lumen',
              repository: process.env.REPO,
              main: 'electron/main.js',
              scripts: { start: 'electron .', 'build:win': 'electron-builder --win nsis --x64 --publish never' },
              devDependencies: {
                electron: '^45.4.1',
                'electron-builder': '^26.18.0'
              },
              build: {
                appId: 'com.lumen.mediaplayer',
                productName: 'Lumen',
                directories: { output: 'dist', buildResources: 'build' },
                files: ['electron/**/*', 'src/**/*'],
                extraResources: [{ from: 'resources/mpv', to: 'mpv', filter: ['**/*'] }],
                fileAssociations: [
                  { ext: ['mp4','mkv','avi','mov','webm','wmv','flv','ts','m2ts','3gp','m4v'], name: 'Lumen Video', description: 'Video File', role: 'Viewer' },
                  { ext: ['mp3','flac','wav','aac','ogg','opus','m4a','wma','alac'], name: 'Lumen Audio', description: 'Audio File', role: 'Viewer' }
                ],
                win: {
                  icon: 'build/icon.ico',
                  signAndEditExecutable: Boolean(process.env.WIN_CSC_LINK),
                  requestedExecutionLevel: 'asInvoker',
                  target: [{ target: 'nsis', arch: ['x64'] }],
                  artifactName: 'Lumen-Setup-' + process.env.VER + '-x64.exe'
                },
                nsis: {
                  oneClick: false,
                  perMachine: false,
                  allowToChangeInstallationDirectory: true,
                  createDesktopShortcut: true,
                  createStartMenuShortcut: true,
                  runAfterFinish: true,
                  shortcutName: 'Lumen Media Player',
                  installerIcon: 'build/icon.ico',
                  uninstallerIcon: 'build/icon.ico',
                  installerHeader: 'build/installerHeader.bmp',
                  installerSidebar: 'build/installerSidebar.bmp',
                  deleteAppDataOnUninstall: false
                }
              }
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('Generated Lumen v' + pkg.version + ' with File Explorer Open With & modern NSIS branding');
          "

      - name: Download mpv, ffmpeg & ffprobe Windows x64 binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $headers = @{ "User-Agent" = "lumen-ci"; "Authorization" = "Bearer $env:GH_TOKEN" }
          try {
            $mpvRel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
            $mpvAsset = $mpvRel.assets | Where-Object { $_.name -match '^mpv-x86_64-.*\.7z$' -and $_.name -notmatch 'v3' } | Select-Object -First 1
            if ($mpvAsset) {
              Invoke-WebRequest -Uri $mpvAsset.browser_download_url -OutFile "mpv.7z"
              7z x mpv.7z -o"mpv_tmp" -y | Out-Null
              $exe = Get-ChildItem -Path "mpv_tmp" -Filter "mpv.exe" -Recurse | Select-Object -First 1
              if ($exe) { Copy-Item $exe.FullName -Destination "resources/mpv/mpv.exe" -Force }
              Get-ChildItem -Path "mpv_tmp" -Filter "*.dll" -Recurse | ForEach-Object { Copy-Item $_.FullName -Destination (Join-Path "resources/mpv" $_.Name) -Force }
              Remove-Item -Recurse -Force "mpv.7z", "mpv_tmp" -ErrorAction SilentlyContinue
            }
          } catch { Write-Warning "mpv download warning: $_" }
          try {
            Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
            Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_tmp" -Force
            $ffp = Get-ChildItem -Path "ffmpeg_tmp" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
            $ffm = Get-ChildItem -Path "ffmpeg_tmp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            if ($ffp) { Copy-Item $ffp.FullName -Destination "resources/mpv/ffprobe.exe" -Force }
            if ($ffm) { Copy-Item $ffm.FullName -Destination "resources/mpv/ffmpeg.exe" -Force }
            Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_tmp" -ErrorAction SilentlyContinue
          } catch { Write-Warning "ffmpeg download warning: $_" }

      - name: Install latest dependencies, verify runtime security & build Windows Installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.WIN_CSC_LINK != '' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          npm install --no-audit --no-fund
          npm audit --omit=dev
          npm run build:win

      - name: Publish direct Windows .exe Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Lumen Media Player v${{ env.APP_VERSION }}
          body: |
            ### Lumen Media Player v${{ env.APP_VERSION }} (Windows 11)
            - **Direct Windows Installer**: Download and double-click `Lumen-Setup-${{ env.APP_VERSION }}-x64.exe` below.
            - **Windows File Explorer "Open With"**: Lumen now registers for video & audio formats so you can right-click any file in Explorer → **Open with → Lumen**.
            - **6 Subtitle Animation Presets + Ultra-Fast Loading**: Hormozi Pop, Box Spotlight, Karaoke Fill, Neon Glow, Typewriter, and Classic Cinema with `-vn -an -dn` parallel extraction, disk caching, and O(log n) binary-search cue lookup.
            - **Playlists + Pro Tools**: Visible 3-dot (`•••`) menu on every video card to add/create playlists, plus A-B Loop, Screenshot (`S`), Video Color Adjustments, Sleep Timer, and a Liquid Glass in-app updater with live download progress.
          files: dist/Lumen-Setup-*.exe
          generate_release_notes: true
          make_latest: true
